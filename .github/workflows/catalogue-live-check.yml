name: Live catalogue verification
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]

permissions:
  contents: read

jobs:
  browser:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser tools
        run: |
          npm install --prefix "$RUNNER_TEMP/biserry-browser" playwright@1.51.1 --no-audit --no-fund
          node "$RUNNER_TEMP/biserry-browser/node_modules/playwright/cli.js" install chromium --with-deps
      - name: Check live Shop and Popular Products
        run: PLAYWRIGHT_PATH="$RUNNER_TEMP/biserry-browser/node_modules/playwright" node tests/live-catalogue.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-catalogue-verification
          path: live-check
          retention-days: 14
