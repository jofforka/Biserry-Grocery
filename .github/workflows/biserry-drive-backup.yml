name: Biserry Weekly Google Drive Backup

on:
  workflow_dispatch:
  schedule:
    - cron: "20 2 * * 0"

permissions:
  contents: read

jobs:
  drive-backup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: automation
    steps:
      - name: Checkout Biserry
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pinned dependencies
        run: npm install --no-fund --no-audit

      - name: Back up Firestore to private Google Drive folder
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
        run: node backup-to-drive.mjs
