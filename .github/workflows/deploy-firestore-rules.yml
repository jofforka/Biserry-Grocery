name: Manual Firestore Rules Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: biserry-firestore-rules-deploy
  cancel-in-progress: false

jobs:
  deploy-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Biserry
        uses: actions/checkout@v4

      - name: Verify pinned admin UID
        shell: bash
        run: |
          grep -F "request.auth.uid == 'mFmTWqhWOxfxE9G0yHDuzZrmKy13'" firestore.rules.v11.1-stability
          grep -F '"mFmTWqhWOxfxE9G0yHDuzZrmKy13"' js/firebase-config.js

      - name: Prepare Firebase service account
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          test -n "$FIREBASE_SERVICE_ACCOUNT"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"

      - name: Deploy Firestore rules only
        shell: bash
        run: |
          npx --yes firebase-tools@13.35.1 deploy \
            --only firestore:rules \
            --project biserry-groceries-os \
            --config firebase.rules-deploy.json \
            --non-interactive
