name: Biserry Autopilot

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: read

concurrency:
  group: biserry-autopilot
  cancel-in-progress: false

jobs:
  dispatch-autopilot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: automation
    steps:
      - name: Checkout Biserry
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pinned automation dependency
        run: npm install --no-fund --no-audit

      - name: Run Biserry Autopilot
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node biserry-autopilot.mjs
