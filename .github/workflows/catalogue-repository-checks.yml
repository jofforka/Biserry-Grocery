name: Catalogue repository checks
on:
  pull_request:
  push:
    branches-ignore: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate catalogue image paths and safeguards
        run: node --test tests/*.test.cjs
      - name: Install browser tools
        run: |
          npm install --prefix "$RUNNER_TEMP/biserry-browser" playwright@1.51.1 --no-audit --no-fund
          node "$RUNNER_TEMP/biserry-browser/node_modules/playwright/cli.js" install chromium --with-deps
      - name: Verify local Shop and Popular Products layouts
        run: PLAYWRIGHT_PATH="$RUNNER_TEMP/biserry-browser/node_modules/playwright" node tests/catalogue-layout.cjs
