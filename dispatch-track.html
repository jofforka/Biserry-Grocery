<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="theme-color" content="#0f4f2b"><title>Track Dispatch | Biserry</title><link rel="icon" href="assets/logo.png"><link rel="stylesheet" href="css/styles.css"><link rel="stylesheet" href="css/premium-v7.css?v=7.2"><link rel="stylesheet" href="css/dispatch-v11.css?v=11.0"><style>.trackWrap{width:min(850px,92%);margin:45px auto}.trackCard{background:#fff;border:1px solid #e1e8de;border-radius:28px;padding:28px;box-shadow:0 18px 55px rgba(15,79,43,.09);margin-bottom:18px}.trackSteps{display:grid;grid-template-columns:repeat(9,1fr);gap:6px;margin:22px 0}.trackStep{padding:11px 7px;border-radius:13px;background:#eef1eb;text-align:center;font-size:11px;font-weight:800;color:#7b837c}.trackStep.done{background:#dff3e5;color:#176b37}.trackStep.current{background:#0f4f2b;color:#fff}.trackMeta{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.trackMeta>div{background:#f7f9f5;padding:14px;border-radius:16px}.trackMeta small,.trackMeta strong{display:block}.trackMeta small{color:#777}.paymentBox{background:#fff8e8;border:1px solid #edd79c;border-radius:18px;padding:18px;margin-top:18px}.paymentForm{display:grid;gap:12px;margin-top:15px}.paymentForm input{width:100%}@media(max-width:700px){.trackSteps{grid-template-columns:1fr 1fr}.trackMeta{grid-template-columns:1fr}.trackCard{padding:18px}}</style></head><body class="dispatchV10"><header class="topbar"><div class="brand"><img src="assets/logo.png" class="logo-img" alt="Biserry"><div><h1>Biserry Dispatch</h1><p>Track Booking</p></div></div><nav><a href="dispatch.html">Book Dispatch</a><a href="index.html">Home</a></nav></header><main class="trackWrap"><section class="trackCard"><span class="sectionLabel">Dispatch Tracking</span><h1 id="trackTitle">Loading booking…</h1><p id="trackMessage">Checking the latest status.</p><div id="trackSteps" class="trackSteps"></div><div id="trackMeta" class="trackMeta"></div></section><section id="paymentSection" class="trackCard" hidden><span class="sectionLabel">Payment</span><h2>Complete your dispatch payment</h2><div id="paymentDetails" class="paymentBox"></div><form id="dispatchPaymentForm" class="paymentForm"><label>Bank transfer reference<input id="dispatchPaymentReference" maxlength="100" placeholder="Transaction/reference number"></label><label>Receipt image <small>(optional when Cloudinary is not configured)</small><input id="dispatchReceipt" type="file" accept="image/*"></label><button id="submitDispatchPayment" class="btn" type="submit">Submit Payment Proof</button></form><div id="paymentSubmitted" class="emptyState" hidden></div></section><section class="trackCard"><h2>Need help?</h2><p>Keep your booking reference when contacting Biserry.</p><a id="trackWhatsApp" class="btn" target="_blank" rel="noopener">WhatsApp Biserry</a></section></main><script type="module" src="js/dispatch-track.js?v=11.0"></script></body></html>
